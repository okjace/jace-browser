<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jace</title>
  <link rel="stylesheet" href="../ui.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 16px; }
    .card { max-width: 420px; text-align: center; }
    img { width: 64px; height: 64px; }
  </style>
  <script type="module" src="signed-in.js"></script>
</head>
<body>
  <div class="card">
    <img src="../icons/jace-64.png" alt="">
    <h1 id="title">Signed in to Jace</h1>
    <p class="muted" id="text">You're signed in. Turn on sync in the Jace settings to bring over your bookmarks, history, tabs and site sign-ins.</p>
    <button class="primary" id="settings">Open Jace settings</button>
  </div>
</body>
</html>
