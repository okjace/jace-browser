  "browser.backup.enabled": false,
  "browser.backup.archive.enabled": false,
  "browser.backup.restore.enabled": false,

  // Address bar: no Mozilla partner suggestions (Yelp, MDN, AMP, Wikipedia, add-ons)
  "browser.urlbar.suggest.yelp": false,
  "browser.urlbar.suggest.yelpRealtime": false,
  "browser.urlbar.suggest.mdn": false,
  "browser.urlbar.suggest.amp": false,
  "browser.urlbar.suggest.wikipedia": false,
  "browser.urlbar.suggest.addons": false,
  "browser.urlbar.suggest.weather": false,
  "browser.urlbar.trending.featureGate": false,
  "browser.urlbar.weather.featureGate": false,

  // Shopping review checker
  "browser.shopping.experience2023.enabled": false,
  "browser.shopping.experience2023.integratedSidebar": false,
};
for (const [name, value] of Object.entries(JACE_LOCKED)) {
  try {
    lockPref(name, value);
  } catch (e) {
    Components.utils.reportError(e);
  }
}

try {
  (function () {
    const Cc = Components.classes;
    const Ci = Components.interfaces;
    const dirsvc = Cc["@mozilla.org/file/directory_service;1"].getService(Ci.nsIProperties);
    const dir = dirsvc.get("GreD", Ci.nsIFile);
    dir.append("jacebrowser"); // not "jace": that's the program file's name
    if (!dir.exists()) {
      return;
    }
    // Not called chrome.manifest: Firefox's packager takes files with that
    // name out of the package (it merges *.manifest files itself), so the
    // packaged browser had no chrome://jace/. Any name works for autoRegister.
    const manifest = dir.clone();
    manifest.append("jace-chrome.txt");
    Components.manager.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(manifest);

    // resource://jace/ is mirrored into content processes (chrome:// isn't), so
    // the WebUSB child actor can load from there.
    const io = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService);
    io.getProtocolHandler("resource")
      .QueryInterface(Ci.nsIResProtocolHandler)
      .setSubstitution("jace", io.newFileURI(dir));

    ChromeUtils.importESModule("chrome://jace/content/JaceLoader.sys.mjs").JaceLoader.init();
  })();
} catch (e) {
  Components.utils.reportError(e);
}
