// Jace Browser startup (the first line of this file must be a comment).
//
// Registers the chrome://jace/ and resource://jace/ packages from the "jace"
// folder next to this file, then starts JaceLoader, which adds the Jace
// account button, the vertical tabs toggle, Jace sync, and WebUSB.
// ---------------------------------------------------------------------------
// Mozilla's tracking: off, and locked so nothing (an add-on, a study, a
// remote experiment, a pref reset) can turn it back on. Each line names what
// it stops. distribution/policies.json covers the rest (see policies/).
//
// Kept on purpose, because turning them off makes you less safe or breaks
// something you asked for (about:jace -> Privacy lists them too):
//   - Safe Browsing (Google's malware/phishing lists, checked by hash)
//   - Remote Settings security lists (revoked certificates, bad add-ons)
//   - The Widevine download (DRM), and add-on updates from addons.mozilla.org
// ---------------------------------------------------------------------------
const JACE_LOCKED = {
  // Telemetry and Glean: all usage, health, and performance reports
  "toolkit.telemetry.enabled": false,
  "toolkit.telemetry.unified": false,
  "toolkit.telemetry.archive.enabled": false,
  "toolkit.telemetry.server": "data:,",
  "toolkit.telemetry.newProfilePing.enabled": false,
  "toolkit.telemetry.shutdownPingSender.enabled": false,
  "toolkit.telemetry.firstShutdownPing.enabled": false,
  "toolkit.telemetry.updatePing.enabled": false,
  "toolkit.telemetry.bhrPing.enabled": false,
  "toolkit.telemetry.coverage.opt-out": true,
  "toolkit.coverage.opt-out": true,
  "toolkit.coverage.endpoint.base": "",
  "datareporting.healthreport.uploadEnabled": false,
  "datareporting.policy.dataSubmissionEnabled": false,
  "datareporting.usage.uploadEnabled": false,
  // Studies and remote experiments (Normandy, Nimbus)
  "app.normandy.enabled": false,
  "app.normandy.api_url": "",
  "app.shield.optoutstudies.enabled": false,
  "messaging-system.rsexperimentloader.enabled": false,
  "nimbus.rollouts.enabled": false,
  // Crash reports
  "breakpad.reportURL": "",
  "browser.tabs.crashReporting.sendReport": false,
  "browser.crashReports.unsubmittedCheck.autoSubmit2": false,
  // Ads, sponsored content and their click tracking
  "browser.newtabpage.activity-stream.feeds.telemetry": false,
  "browser.newtabpage.activity-stream.telemetry": false,
  "browser.newtabpage.activity-stream.showSponsored": false,
  "browser.newtabpage.activity-stream.showSponsoredTopSites": false,
  "browser.newtabpage.activity-stream.feeds.section.topstories": false,
  "browser.topsites.contile.enabled": false,
  "browser.partnerlink.attributionURL": "",
  "browser.urlbar.suggest.quicksuggest.sponsored": false,
  "browser.urlbar.quicksuggest.dataCollection.enabled": false,
  // Firefox switches these back on at startup (by region / rollout), so lock them:
  "browser.urlbar.quicksuggest.enabled": false,
  "signon.firefoxRelay.feature": "disabled",
  "browser.tabs.firefox-view": false,
  "browser.ping-centre.telemetry": false,
  "browser.vpn_promo.enabled": false,
  "extensions.pocket.enabled": false,
  // Ad measurement in pages ("privacy-preserving attribution")
  "dom.private-attribution.submission.enabled": false,
  // Search telemetry
  "browser.search.serpEventTelemetryCategorization.enabled": false,
  // Personalized recommendations
  "browser.discovery.enabled": false,
  "extensions.getAddons.showPane": false,
  "extensions.htmlaboutaddons.recommendations.enabled": false,
  "browser.newtabpage.activity-stream.asrouter.userprefs.cfr.addons": false,
  "browser.newtabpage.activity-stream.asrouter.userprefs.cfr.features": false,
  // Background pings to Mozilla's servers
  "network.captive-portal-service.enabled": false,
  "network.connectivity-service.enabled": false,
  "captivedetect.canonicalURL": "",
  "network.trr.confirmation_telemetry_enabled": false,
  "browser.region.update.enabled": false,
  "browser.region.network.url": "",
  "extensions.webcompat-reporter.enabled": false,
  "browser.contentblocking.report.monitor.enabled": false,
  // Mozilla's terms-of-use and data-notice screens (Jace Browser has its own setup)
  "browser.preonboarding.enabled": false,
  "termsofuse.bypassNotification": true,
  "datareporting.policy.dataSubmissionPolicyBypassNotification": true,
  // Mozilla accounts and Firefox's own updater (Jace accounts and Jace updates replace them)
  "identity.fxaccounts.enabled": false,
  "app.update.auto": false,

  // Firefox's AI features: its master switch set to blocked (and each one),
  // so none run or show up. Translations stay: they run on your computer.
  "browser.ai.control.default": "blocked",
  "browser.ai.control.sidebarChatbot": "blocked",
  "browser.ai.control.smartWindow": "blocked",
  "browser.ai.control.smartTabGroups": "blocked",
