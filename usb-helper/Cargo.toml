[package]
name = "jace-usb-helper"
version = "1.0.0"
edition = "2021"
license = "MPL-2.0"
description = "Native USB access for Jace Browser's WebUSB support (JSON lines over stdin/stdout)"

[dependencies]
nusb = "0.1.14"
futures-lite = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
