# Publish platforms of an already finished Build run (no rebuild, free):
# their downloads go to the GitHub release for the current version (created
# if needed) and Jace Store is refreshed. For when a build passed but its
# release step didn't, or to add a platform later.
name: Publish

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run whose downloads to publish"
        required: true
      platforms:
        description: "Which: any of linux, windows, macos (comma-separated)"
        required: true
        default: "linux"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      JACE_STORE_TOKEN: ${{ secrets.JACE_STORE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: contains(inputs.platforms, 'linux')
        with:
          name: linux
          path: artifacts
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        if: contains(inputs.platforms, 'windows')
        with:
          name: windows
          path: artifacts
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        if: contains(inputs.platforms, 'macos')
        with:
          pattern: macos-*
          merge-multiple: true
          path: artifacts
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Publish
        run: |
          rm -f artifacts/jace-usb-helper.exe
          ls -la artifacts
          python3 packaging/release.py "v$(python3 scripts/build.py version)" artifacts/*
