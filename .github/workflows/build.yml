# Builds Jace Browser for Windows, macOS and Linux, the same way Jace Launcher
# does (Linux and Windows on Ubicloud runners, macOS on GitHub's):
# - every push / PR runs the tests; manual runs, v* tags and pushes that raise
#   the version also build every platform, test the installers, and upload
#   them as workflow artifacts
# - raising "version" in jace.json (or a manual run of a new version) publishes
#   each platform as soon as its build and installer test pass
#   (no tag needed); pushing a v* tag also works
# - the release is then listed on Jace Store (needs the JACE_STORE_TOKEN secret)
#
# Firefox is big: a build takes 2-5 hours per platform on GitHub's free
# runners, so jobs get the 6-hour maximum.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Docs and the dev-only script don't change the browser: no multi-hour rebuild.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "scripts/dev-install.py"
      - "scripts/try.sh"
      - "extension/**"
      - ".github/workflows/extension.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Ordinary pushes (tests only) never cancel a build that's running; a build
# only waits for the one before it.
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  version:
    # Is this push a new version? (version in jace.json with no release yet)
    # Then a green build on main releases it automatically - no tag needed.
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python3 scripts/build.py version)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main && ( "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ) ]] && ! gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "New version v$V: will be released if every build passes"
            echo "tag=v$V" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "v$V is already released (or this isn't a push to main): build and test only"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          # The Firefox builds cost money (Ubicloud runners), so they only run for:
          # a manual run (Actions -> Build -> Run workflow), a v* tag, or a push
          # that raises the version in jace.json. Other pushes run the quick tests.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] && [[ "$(git show "${{ github.event.before }}:jace.json" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' 2>/dev/null)" != "$V" ]]; then
            echo "The version changed to $V in this push: building"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a new version: tests only (start a build from Actions -> Build -> Run workflow)"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Sync merge and encryption tests
        run: node --test tests/*.test.mjs
      - name: Firefox auto-update script tests
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: Syntax-check the browser code
        run: for f in $(find src -name '*.mjs' -o -name '*.js'); do node --check "$f"; done
      - name: USB helper builds and answers
        working-directory: usb-helper
        run: |
          cargo build --release
          printf '{"id":1,"cmd":"hello"}\n{"id":2,"cmd":"list"}\n' | timeout 10 ./target/release/jace-usb-helper | tee out.txt
          grep -q '"id":1,"ok":true' out.txt

  usb-helper-windows:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build jace-usb-helper.exe
        working-directory: usb-helper
        run: cargo build --release
      - name: It answers (no extra DLLs needed)
        working-directory: usb-helper
        shell: bash
        timeout-minutes: 3
        run: |
          printf '{"id":1,"cmd":"hello"}\n{"id":2,"cmd":"list"}\n' | timeout 15 ./target/release/jace-usb-helper.exe | tee out.txt || true
          grep -q '"id":1' out.txt
      - uses: actions/upload-artifact@v7
        with:
          name: usb-helper-windows
          path: usb-helper/target/release/jace-usb-helper.exe

  linux:
    needs: [version, tests]
    if: needs.version.outputs.build == 'true'
    # Ubicloud's 16-core runner (~$0.0064/min; about 40-60 min a build; the project's quota is 16 cores).
    # Older Ubuntu = older glibc = the AppImage runs on more distros.
    # To go back to GitHub's free (slower) runner, set the repository
    # variable JACE_LINUX_RUNNER to ubuntu-22.04.
    runs-on: ${{ vars.JACE_LINUX_RUNNER || 'ubicloud-standard-16-ubuntu-2204' }}
    timeout-minutes: 240
    permissions:
      contents: write   # only to attach a failed package to the ci-linux-debug pre-release
    env:
      # Compiler cache in GitHub's cache: rebuilds only recompile what changed.
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Make room for Firefox (needs ~40 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v7
      - name: Set up the compiler cache (sccache)
        uses: mozilla-actions/sccache-action@v0.0.9
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Get Firefox's source
        run: python3 scripts/build.py download
      - name: Add Jace Browser to it
        run: python3 scripts/build.py prepare --platform linux
      - name: Build
        run: python3 scripts/build.py build --platform linux
      - name: Package (tar.xz and AppImage)
        run: |
          sudo apt-get install -y libfuse2 desktop-file-utils
          python3 scripts/build.py package --platform linux
      - name: Self-test the AppImage (headless)
        env:
          GH_TOKEN: ${{ github.token }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          JACE_SELF_TEST_OUT: ${{ runner.temp }}/selftest.txt
          JACE_SELF_TEST_UPDATE_KIND: appimage
          MOZ_HEADLESS: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/profile"
          timeout 300 ./dist/JaceBrowser-*-x86_64.AppImage --headless -no-remote -profile "$RUNNER_TEMP/profile" || true
          if grep -q "SELF-TEST OK" "$JACE_SELF_TEST_OUT" 2>/dev/null; then cat "$JACE_SELF_TEST_OUT"; exit 0; fi
          echo "::group::Self-test report"; cat "$JACE_SELF_TEST_OUT" 2>/dev/null || echo "(no report written)"; echo "::endgroup::"
          echo "::group::Jace startup log (profile)"; cat "$RUNNER_TEMP/profile/jace-startup.log" 2>/dev/null || echo "(no startup log: Jace's code didn't run)"; echo "::endgroup::"
          echo "::group::What's in the package"
          mkdir -p "$RUNNER_TEMP/pkg" && tar -xf dist/JaceBrowser-*-linux-x86_64.tar.xz -C "$RUNNER_TEMP/pkg"
          python3 scripts/check_package.py "$RUNNER_TEMP/pkg/jace" || true
          echo "Firefox's start-up-file (autoconfig) support in libxul: $(grep -c "general.config.filename" "$RUNNER_TEMP/pkg/jace/libxul.so" || true) mention(s)"
          echo "::endgroup::"
          echo "::group::Browser console (second run, errors printed)"
          rm -rf "$RUNNER_TEMP/profile2" && mkdir -p "$RUNNER_TEMP/profile2"
          printf 'user_pref("devtools.console.stdout.chrome", true);\nuser_pref("browser.dom.window.dump.enabled", true);\n' > "$RUNNER_TEMP/profile2/user.js"
          timeout 90 "$RUNNER_TEMP/pkg/jace/jace" --headless -no-remote -profile "$RUNNER_TEMP/profile2" 2>&1 | grep -v "^\s*$" | head -150 || true
          echo "::endgroup::"
          # Attach the package to a "ci-linux-debug" pre-release, so it can be
          # downloaded and run to find out why (never marked latest).
          gh release delete ci-linux-debug -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create ci-linux-debug -R "$GITHUB_REPOSITORY" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "CI debug: Linux package that failed its self-test" \
            --notes "Not a release. The Linux package from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID, kept to look into a failed self-test." \
            dist/JaceBrowser-*-linux-x86_64.tar.xz || true
          exit 1
      - uses: actions/upload-artifact@v7
        # Kept even when the self-test fails, to look into it.
        if: always()
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.tar.xz

  windows:
    # Cross-compiled on Linux, like Mozilla builds Firefox for Windows.
    needs: [version, tests, usb-helper-windows]
    if: needs.version.outputs.build == 'true'
    # Ubicloud's 16-core runner; JACE_WINDOWS_RUNNER=ubuntu-24.04 for GitHub's free one.
    runs-on: ${{ vars.JACE_WINDOWS_RUNNER || 'ubicloud-standard-16' }}
    timeout-minutes: 240
    env:
      # Compiler cache in GitHub's cache: rebuilds only recompile what changed.
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Make room for Firefox (needs ~40 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v7
      - name: Set up the compiler cache (sccache)
        uses: mozilla-actions/sccache-action@v0.0.9
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pillow
      - uses: actions/download-artifact@v8
        with:
          name: usb-helper-windows
          path: usb-helper-windows
      - name: Get Firefox's source
        run: python3 scripts/build.py download
      - name: Add Jace Browser to it
        run: python3 scripts/build.py prepare --platform windows --usb-helper usb-helper-windows/jace-usb-helper.exe
      - name: Install build tools
        run: |
          sudo apt-get update && sudo apt-get install -y zstd msitools
          # Firefox's Rust code has to be compiled for Windows too.
          rustup target add x86_64-pc-windows-msvc
          cd engine && ./mach --no-interactive bootstrap --application-choice browser
      - name: Get the Windows SDK and MSVC libraries
        run: python3 scripts/build.py vs-sdk --platform windows
      - name: Build
        run: python3 scripts/build.py build --platform windows --no-bootstrap
      - name: Package (setup .exe and portable .zip)
        run: python3 scripts/build.py package --platform windows
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip

  windows-installer-test:
    # Install the setup .exe on real Windows, self-test, uninstall.
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: win
      - name: Test the Windows installer, self-test and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Get-ChildItem win\*-setup.exe)[0].FullName
          # 1. silent install, like an admin deploying it
          $p = Start-Process -FilePath $setup -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exited with $($p.ExitCode)" }
          # Where did it go? Ask Windows (the installed-apps entry), then look.
          # (The setup stub can return before the real installer is done: wait up to 2 minutes.)
          for ($i = 0; $i -lt 24; $i++) {
            $key = Get-ChildItem "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall", "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue | Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like "Jace*" } | Select-Object -First 1
            if ($key -and -not (Get-Process -Name "setup" -ErrorAction SilentlyContinue)) { break }
            Start-Sleep -Seconds 5
          }
          $key = Get-ChildItem "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall", "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue | Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like "Jace*" } | Select-Object -First 1
          $dir = if ($key) { (Get-ItemProperty $key.PSPath).InstallLocation } else { $null }
          if (!$dir -or !(Test-Path "$dir\jace.exe")) {
            $found = Get-ChildItem "$env:ProgramFiles", "${env:ProgramFiles(x86)}", "$env:LOCALAPPDATA" -Filter "jace.exe" -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $dir = $found.DirectoryName }
          }
          if (!$dir -or !(Test-Path "$dir\jace.exe")) {
            "Installed apps entry: $($key.PSPath)"
            Get-ChildItem "$env:ProgramFiles" | Select-Object Name
            throw "not installed (no jace.exe found)"
          }
          "Installed in $dir"
          $exe = "$dir\jace.exe"
          if (!(Test-Path "$dir\jacebrowser\bin\jace-usb-helper.exe")) { throw "USB helper missing" }
          if (!(Test-Path "$dir\jace.cfg")) { throw "jace.cfg missing" }
          if (!(Test-Path "$dir\distribution\policies.json")) { throw "policies.json missing" }
          $lnk = Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs", "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter "Jace*.lnk" -Recurse -ErrorAction SilentlyContinue
          if (!$lnk) { throw "Start menu shortcut missing" }
          if (!$key) { throw "Installed apps entry missing" }
          Get-ItemProperty $key.PSPath | Select-Object DisplayName, DisplayVersion, UninstallString | Format-List
          # 2. the installed browser starts, loads Jace Browser's parts, and quits
          $env:JACE_SELF_TEST_OUT = "$env:RUNNER_TEMP\selftest.txt"
          $env:JACE_SELF_TEST_UPDATE_KIND = "windows-setup"
          $profile = "$env:RUNNER_TEMP\profile"; New-Item -ItemType Directory $profile | Out-Null
          Start-Process -FilePath $exe -ArgumentList "--headless","-no-remote","-profile",$profile -Wait
          Get-Content $env:JACE_SELF_TEST_OUT
          if (-not (Select-String -Path $env:JACE_SELF_TEST_OUT -Pattern "SELF-TEST OK" -Quiet)) { throw "self-test failed" }
          # 3. uninstall removes it
          Start-Process -FilePath "$dir\uninstall\helper.exe" -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 10
          if (Test-Path $exe) { throw "jace.exe left behind" }
          "WINDOWS INSTALLER OK"

  macos:
    needs: [version, tests]
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Both on Apple Silicon machines: GitHub's Intel Macs have an Apple SDK
        # too old for current Firefox, so the Intel build is cross-compiled.
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      JACE_MAC_ARCH: ${{ matrix.arch }}
      # Compiler cache in GitHub's cache: rebuilds only recompile what changed.
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Set up the compiler cache (sccache)
        uses: mozilla-actions/sccache-action@v0.0.9
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Build the USB helper
        working-directory: usb-helper
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }}
      - name: Get Firefox's source
        run: python3 scripts/build.py download
      - name: Add Jace Browser to it
        run: python3 scripts/build.py prepare --platform macos --usb-helper usb-helper/target/${{ matrix.target }}/release/jace-usb-helper
      - name: Build
        run: python3 scripts/build.py build --platform macos
      - name: Package (.dmg)
        run: python3 scripts/build.py package --platform macos
      - name: Test the Mac installer (install from a downloaded .dmg, self-test, remove)
        env:
          JACE_SELF_TEST_OUT: ${{ runner.temp }}/selftest.txt
          JACE_SELF_TEST_UPDATE_KIND: macos-app
        run: |
          set -x
          # The Intel build runs through Rosetta on this Apple Silicon machine.
          if [ "$JACE_MAC_ARCH" = x86_64 ]; then softwareupdate --install-rosetta --agree-to-license || true; fi
          DMG=$(ls dist/*.dmg)
          # mark it as downloaded from the internet, like Safari does
          xattr -w com.apple.quarantine "0081;$(printf %x $(date +%s));Safari;" "$DMG"
          hdiutil attach -nobrowse -mountpoint /Volumes/JaceBrowser "$DMG"
          test -L /Volumes/JaceBrowser/Applications
          ditto "/Volumes/JaceBrowser/Jace Browser.app" "/Applications/Jace Browser.app"
          hdiutil detach /Volumes/JaceBrowser
          APP="/Applications/Jace Browser.app"
          codesign --verify --deep --strict "$APP"
          test -x "$APP/Contents/Resources/jacebrowser/bin/jace-usb-helper"
          test -f "$APP/Contents/Resources/distribution/policies.json"
          mkdir -p "$RUNNER_TEMP/profile"
          # (macOS has no `timeout` command; perl's alarm does the same)
          perl -e 'alarm 300; exec @ARGV' "$APP/Contents/MacOS/jace" --headless -no-remote -profile "$RUNNER_TEMP/profile" || true
          cat "$JACE_SELF_TEST_OUT"
          grep -q "SELF-TEST OK" "$JACE_SELF_TEST_OUT"
          rm -rf "$APP"
          echo "MAC INSTALLER OK"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg

  release:
    # Each platform is published as soon as it passes: whichever finishes
    # first creates the release, the others add their downloads to it, and
    # the Jace Store entry is refreshed each time. A platform that fails is
    # simply left out.
    if: always() && needs.version.outputs.publish == 'true' && (needs.linux.result == 'success' || needs.windows-installer-test.result == 'success')
    needs: [version, linux, windows, windows-installer-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      JACE_STORE_TOKEN: ${{ secrets.JACE_STORE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: needs.linux.result == 'success'
        with:
          name: linux
          path: artifacts
      - uses: actions/download-artifact@v8
        if: needs.windows-installer-test.result == 'success'
        with:
          name: windows
          path: artifacts
      - name: Publish (GitHub release, then Jace Store)
        run: |
          rm -f artifacts/jace-usb-helper.exe
          python3 packaging/release.py "${{ needs.version.outputs.tag }}" artifacts/*

  release-macos:
    if: always() && needs.version.outputs.publish == 'true'
    needs: [version, release, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      JACE_STORE_TOKEN: ${{ secrets.JACE_STORE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-*
          path: artifacts
          merge-multiple: true
      - name: Add the Mac downloads (GitHub release, then Jace Store)
        run: |
          shopt -s nullglob
          files=(artifacts/*.dmg)
          if [ ${#files[@]} -eq 0 ]; then echo "::warning::No Mac build succeeded - nothing to add"; exit 0; fi
          python3 packaging/release.py "${{ needs.version.outputs.tag }}" "${files[@]}"

  report-failure:
    # An automatic Firefox update that doesn't build or pass its tests gets
    # an issue, so it doesn't fail quietly. (Nothing is released in that case.)
    if: failure() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [version, tests, linux, windows, windows-installer-test, macos]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python3 scripts/build.py version)
          FF=$(python3 -c "import json;print(json.load(open('jace.json'))['firefox'])")
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "Jace Browser $V (Firefox $FF) didn't build" \
            --body "The automatic update to Firefox $FF failed, so it wasn't released. Installed copies stay on the previous version. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
